[project]
name = "cre-document-intelligence-backend"
version = "2.0.0"
description = "CRE Document Intelligence Platform - AI-assisted document analysis backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "python-multipart>=0.0.9",
    "anthropic>=0.49.0",
    "langgraph>=0.4.0",
    "langsmith>=0.3.0",
    "pypdf>=5.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "reportlab>=4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
